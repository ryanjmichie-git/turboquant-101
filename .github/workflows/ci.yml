name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install base deps + dev tools
        # ruff pinned: newer releases lint stricter by default and fail
        # unchanged code (same version-drift lesson as the vLLM pin)
        run: python -m pip install -r requirements-base.txt pytest "ruff==0.15.22"

      - name: Lint
        run: ruff check .

      - name: Shell syntax
        run: bash -n quickstart.sh

      - name: Regression tests
        run: pytest -q

      # End-to-end CPU path exactly as a fresh user runs it. Runners have
      # no GPU, so this exercises venv creation, the Python gate, base
      # deps, and the full CPU demo, then exits at platform detection.
      - name: quickstart.sh (CPU path)
        run: ./quickstart.sh
