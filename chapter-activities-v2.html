      const n=S.missed[N.i], h1='Round picks the allowed value that is closest to the number.', h2=`${N.txt} is between ${N.lo} and ${N.hi}. Look for the value that is closer.`;
      cls='bad'; top='Not this one.';
      body=`<div data-test="ch3-hint">${n===1?`<p>${h1}</p>`:n===2?`<p>${h2}</p>`:`<p>${h1}</p><p>${h2}</p><p><b>Try again.</b></p>`}</div>`;
    }
    else if(kind==='right'){
      cls='good'; top=`Right: ${N.txt} becomes ${N.to}.`;
      body=`<p data-why data-test="ch3-why">The number moved by ${N.gap}.</p>${done?`<p><b>All three numbers are rounded.</b> Now press Round the rest.</p><div class="row"><button type="button" class="btn t go${api.rm()?'':' pulse'}" data-do="rest" data-test="ch3-rest-card">Round the rest</button></div>`:''}`;
    }
    else if(kind==='rest'){
      cls='good'; top='All 64 numbers are rounded.';
      body='<p>You earned the star.</p>';
    }
    hintCard($('[data-rule]',root),cls,top,body);
  }
  function tryRound(d){
    const N=NUMS.find(x=>x.i===d.n);
    if(!N||S.rest||S.placed[N.i]!==undefined) return;
    if(d.v!==N.k){
      S.missed[N.i]=(S.missed[N.i]||0)+1; renderRack();
      card('wrong',N); api.say('Not this one.');
      if(!api.replaying){ const b=$(`[data-num="${N.i}"]`,root); if(b) b.focus({preventScroll:true}); }
      return;
    }
    S.placed[N.i]=d.v;
    const tile=$(`[data-v="${d.v}"]`,root);
    $('.vslot',tile).innerHTML=`<span class="vnum" data-test="ch3-placed-${N.i}">${N.txt}</span>`;
    tile.setAttribute('aria-label',`${N.to}, with ${N.txt} on it`);
    renderRack();
    const done=Object.keys(S.placed).length===NUMS.length, rest=$('[data-do="rest"]',root);
    card('right',N,done); api.say(`Right: ${N.txt} becomes ${N.to}. The number moved by ${N.gap}.${done?' All three numbers are rounded. Now press Round the rest.':''}`);
    if(done){ rest.disabled=false; if(!api.rm()) rest.classList.add('pulse'); }
    if(!api.replaying){ const b=done?rest:$('[data-num]',root); if(b) b.focus({preventScroll:true}); }
  }
  function roundRest(){
    if(S.rest||Object.keys(S.placed).length<NUMS.length) return; S.rest=true;
    plots.round.set({...ROUND,idx:T.idx,label:'The rounded KV-Cache vector. Each of the 64 numbers sits on one of the 8 allowed values.'},api.rm());
    const b=$('[data-do="rest"]',root); b.disabled=true; b.classList.remove('pulse');
    $$('.vtile',root).forEach(v=>{ v.disabled=true; });
    $('[data-rest-key]',root).hidden=false;
    card('rest'); award();
    api.later(()=>{ const said=show(2); open(3); api.say(`All 64 numbers are rounded. ${said}`); },2000);
  }

  /* step 3 */
  function compare(){
    if(S.cmp) return; S.cmp=true;
    const t=step(3);
    $$('[data-gap]',t).forEach(x=>x.removeAttribute('hidden'));
    $('[data-plot="gap"] svg',t).setAttribute('aria-label','The rounded KV-Cache vector with a red line from each number to its allowed value.');
    $('[data-gap-key]',t).hidden=false;
    $('[data-do="cmp"]',t).disabled=true;
    award(); const said=show(3); open(4);
    api.say(said);
  }
  function noRotate(){
    if(S.norot||!S.cmp) return; S.norot=true;
    const t=step(3), c=$('[data-norot]',t), say=$('[data-norot-say]',t);
    const [one,two]=matchMedia('(max-width:560px)').matches?['first','second']:['left','right'];
    say.innerHTML=`Without Rotate (the ${two} chart), the 8 allowed values must stretch to reach the 4 outliers. Then ${TOP2} of the 64 numbers land on only 2 values, and the <span class="c-red">red lines</span> are long. With Rotate (the ${one} chart), the allowed values sit close together, and every <span class="c-red">red line</span> is short. The average error is ${f2(T.gap[0])} with Rotate and ${f2(T.gapNoRot[0])} without Rotate: about ${Math.round(T.gapNoRot[0]/T.gap[0])} times larger.`;
    c.hidden=false; say.hidden=false; $('[data-do="norot"]',t).disabled=true;
    if(!api.replaying){ c.focus({preventScroll:true}); say.scrollIntoView({block:'nearest',behavior:smooth()}); }
    api.say(say.textContent);
  }

  /* step 4 */
  const NCP={vals:T.rounded,grid:T.vals,idx:T.idx,pick:PICK};
  function ncBeat(n){
    if(S.ncb!==n-1) return; S.ncb=n;
    const t=step(4), b=$(`[data-beat="${n}"]`,t);
    const len=i=>{ $('[data-len]',t).textContent=LEN[i]; $('[data-len-fill]',t).style.width=pct(T.len[i]); };
    b.hidden=false; $(`[data-do="nc${n}"]`,t).disabled=true;
    if(n===1) len(1);
    else if(n===2){ $('[data-len-mark]',t).hidden=false; $('[data-mark-key]',t).hidden=false; }
    else{
      S.nc=true; len(0); $('[data-ghost-key]',t).hidden=false;
      plots.nc.set({...NCP,at:T.vals.map(v=>v*F),ghost:true,label:`The KV-Cache vector after norm correction. Every number is ${SHORT}% farther from 0.`},api.rm());
      award();
      api.later(()=>{ const said=show(4); $('[data-fix]',t).hidden=false; open(5); api.say(`${b.textContent} ${said}`); },2000);
      return;
    }
    const nx=$(`[data-do="nc${n+1}"]`,t); nx.disabled=false;
    if(!api.replaying) nx.focus({preventScroll:true});
    api.say(b.textContent);
  }

  /* step 5 */
  function runTest(k){
    if(S.t[k]||(k&&S.t[k-1]<2)) return; S.t[k]=1;
    const t=step(5), o=TESTS[k], lane=$(`[data-lane="${k}"]`,t), grid=$('[data-grid]',lane), cells=$$('i',grid), miss=new Set(T.miss[k]), say=$('[data-say]',lane);
    let done=0, missed=0;
    $(`[data-do="t${k+1}"]`,t).disabled=true; into(lane);
    const paint=to=>{
      for(;done<to;done++){ const m=miss.has(done); if(m) missed++; cells[done].className=m?'miss':'hit'; }
      $('[data-found]',lane).textContent=`Found: ${done-missed} of ${NQ}`; $('[data-missed]',lane).textContent=`Misses: ${missed}`;
    };
    const end=()=>{
      paint(NQ); S.t[k]=2; say.textContent=o.words;
      const res=`${o.name}: found ${T.score[k]} of ${NQ}, misses ${MISS[k]}.`;
      grid.setAttribute('aria-label',res);
      if(k<2){
        const nx=$(`[data-do="t${k+2}"]`,t); nx.disabled=false;
        if(!api.replaying) nx.focus({preventScroll:true});
        into($(`[data-lane="${k+1}"]`,t)); api.say(res); return;
      }
      S.test=true; award(); const said=show(5); api.finish(); endCard();
      const w=$('[data-what="5"]',t), e=$('[data-end]',t);
      if(e.getBoundingClientRect().bottom-w.getBoundingClientRect().top<=innerHeight-28) into(e);
      else if(!api.replaying) w.scrollIntoView({block:'start',behavior:smooth()});
      api.say(`${res} ${said}`);
    };
    if(api.rm()) return end();
    const t0=performance.now(), DUR=4000;
    (function tick(){
      if(!root.isConnected) return;
      const n=Math.min(NQ,Math.floor((performance.now()-t0)/DUR*NQ));
      paint(n); say.textContent=`Lookup ${Math.min(n+1,NQ)} of ${NQ}`;
      if(n<NQ) requestAnimationFrame(tick); else end();
    })();
  }
  function endCard(){
    const e=$('[data-end]',root);
    e.innerHTML=`<p class="big">Game complete. Stars: ${starsNow().filter(Boolean).length} of 5.</p>
      <p>Each note shrinks to a fraction of its original size, and the notes stay almost as accurate as before.</p>
      <div class="row"><button type="button" class="btn t" data-again data-test="ch3-again">Play again</button><a class="btn next" href="#ch6/1" data-test="ch3-next-game">Next game: Ch 6 Setup for Daily Use</a></div>`;
    e.hidden=false;
  }

  root.addEventListener('click',e=>{
    if(justDragged) return;
    const el=e.target.closest('button'); if(!el||el.disabled||!root.contains(el)) return;
    if(['rot','rest','cmp','norot','nc1','nc2','nc3','t1','t2','t3'].includes(el.dataset.do)) api.do(el.dataset.do);
  });
  const drop=(el,z)=>{ if(z.dataset.v) api.do('try',{n:+el.dataset.num,v:+z.dataset.v}); };
  enableDrag(root,'[data-num]','[data-zone="val"], [data-zone="back"]',drop,true);
  enableTap(root,'[data-num]','[data-zone="val"]',drop,(kind,el)=>{ syncSel(); card(kind,el&&NUMS.find(n=>n.i===+el.dataset.num)); });

  plots.before.set({vals:T.before,out:T.OUT,label:'The KV-Cache vector before Rotate. The 4 red marks are the outliers.'},true);
  plots.round.set({...ROUND,label:'The KV-Cache vector after Rotate, with the 8 allowed values as dashed lines.'},true);
  plots.nc.set({...NCP,label:'The rounded KV-Cache vector. Each of the 64 numbers sits on one of the 8 allowed values.'},true);
  renderRack(); card('start');
  return {
    apply(type,d){
      if(type==='rot') rotate();
      else if(type==='try') tryRound(d);
      else if(type==='rest') roundRest();
      else if(type==='cmp') compare();
      else if(type==='norot') noRotate();
      else if(type==='nc'){ ncBeat(1); ncBeat(2); ncBeat(3); }
      else if(/^nc[123]$/.test(type)) ncBeat(+type[2]);
      else if(type==='test'){ runTest(0); runTest(1); runTest(2); }
      else if(/^t[123]$/.test(type)) runTest(type[1]-1);
    },
    ready(){ award(); }
  };
}

/* ================= Ch 6 · Setup for daily use ================= */
function buildCh6(api){
  const G=api.G, root=api.root;
  const nf=n=>n.toLocaleString('en-US');
  const C4='<code>turboquant_4bit_nc</code>', C3='<code>turboquant_k3v4_nc</code>';
  const SETS=[
    {k:'off',name:'TurboQuant Off',html:'TurboQuant Off',sub:'16 bits for each number',holds:38544,tps:77},
    {k:'nc4',name:'turboquant_4bit_nc',html:C4,sub:'4 bits for each number',holds:112128,tps:61},
    {k:'k3v4',name:'turboquant_k3v4_nc',html:C3,sub:'3 bits for Keys, 4 bits for Values',holds:121984,tps:45}];
  const [OFF,NC4,K3]=SETS, MAX=K3.holds;
  const SITS=[
    {need:2000,right:'off',
      text:'You ask a few short questions in one chat. The chat needs about 2,000 tokens in the KV-Cache (the stack of notes).',
      learn:'A <b>TurboQuant setting</b> is a trade. A stronger setting gives the KV-Cache (the stack of notes) <b>room for more tokens</b>, but the model <b>writes fewer tokens per second</b>. So the rule is: pick the fastest setting that fits.',
      why:`2,000 tokens fit in ${nf(OFF.holds)} tokens, and no setting is faster.`,
      what:`<p>The chat needs 2,000 tokens. That is about ${Math.round(2000/OFF.holds*100)}% of the room in the KV-Cache (the stack of notes) with TurboQuant Off.</p><p>All 3 settings fit, so speed decides. With TurboQuant Off, the model writes ${OFF.tps} tokens per second. With ${C3}, it writes ${K3.tps}.</p><p><b>In practice:</b> for short chats, leave TurboQuant off. A TurboQuant setting gives room that the chat does not use, and the answers come more slowly.</p>`},
    {need:30000,right:'off',
      text:'You load one long report and ask questions about it. The chat needs about 30,000 tokens in the KV-Cache (the stack of notes).',
      learn:'A long chat does not always need TurboQuant. With <b>TurboQuant Off</b>, the KV-Cache on a 16 GB graphics card holds about <b>38,500 tokens</b>. Work below this limit runs fastest without TurboQuant.',
      why:`30,000 tokens still fit in ${nf(OFF.holds)} tokens, and no setting is faster.`,
      what:`<p>The chat needs 30,000 tokens, and the KV-Cache holds ${nf(OFF.holds)} tokens with TurboQuant Off. The chat still fits.</p><p><b>In practice:</b> Chapter 5 of the tutorial tests a text of 25,000 tokens. A 16 GB graphics card holds that much without TurboQuant. TurboQuant helps when the work needs more than about 38,500 tokens.</p>`},
    {need:90000,right:'nc4',
      text:'You run 3 chats at the same time. Each chat holds one long report and needs about 30,000 tokens. The total is 90,000 tokens.',
      learn:'Chats that run at the same time <b>share one KV-Cache</b>, so their tokens add up. When the total is more than about 38,500 tokens, the work needs a TurboQuant setting.',
      why:`90,000 tokens fit in ${nf(NC4.holds)} tokens. The other setting that fits is slower.`,
      what:`<p>The 3 chats share one KV-Cache, so they need 90,000 tokens together. TurboQuant Off holds ${nf(OFF.holds)} tokens, so it does not fit.</p><p>${C4} holds ${nf(NC4.holds)} tokens: about ${(NC4.holds/OFF.holds).toFixed(1)} times more. ${C3} also fits, but the model writes ${K3.tps} tokens per second with it, not ${NC4.tps}.</p><p><b>In practice:</b> this is the setting for daily use. Chapter 6 of the tutorial turns it on with one flag: <code class="nw">--kv-cache-dtype</code> <code class="nw">turboquant_4bit_nc</code>.</p>`}];
  const DO=['Read the situation. Find how many tokens it needs.','Look at the gold line on each setting. A setting fits when its bar reaches the gold line.','Drag the fastest setting that fits onto the situation. Or tap a setting, then tap the situation.'];
  const KEY_MARK='<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false"><rect x="4.5" y="0.75" width="5" height="12.5" fill="#E9B44C" stroke="#1E1A16" stroke-width="1.5"></rect></svg>';
  const KEY_BAR='<svg width="24" height="14" viewBox="0 0 24 14" aria-hidden="true" focusable="false"><rect y="2" width="24" height="10" fill="#5F3C1B"></rect></svg>';
  const S={done:{},miss:{}};
  const step=n=>$(`.step[data-step="${n}"]`,root);
  const pc=v=>(v/MAX*100).toFixed(1)+'%';
  const tile=(o,n,sit)=>`<button type="button" class="term set" data-set="${o.k}" aria-pressed="false" data-test="ch6-set-${n}-${o.k}"><span class="set-top"><span class="set-name">${o.html}</span><span class="set-sub">${o.sub}</span></span><span class="bar" aria-hidden="true"><i class="f-notes" style="width:${pc(o.holds)}"></i><b class="mark" style="left:${pc(sit.need)}"></b></span><span class="set-facts"><span>Holds ${nf(o.holds)} tokens</span><span>Writes ${o.tps} tokens per second</span></span></button>`;

  root.innerHTML=SITS.map((sit,i)=>{ const n=i+1; return `
  <section class="step has-hint" data-step="${n}" hidden>
    ${head(G,n,{learn:sit.learn,do:DO})}
    <p class="q" data-test="ch6-rule-line">Pick the fastest setting that fits.</p>
    <div class="s1">
      <div>
        <div class="tb sit" data-zone="sit" data-test="ch6-sit-${n}"><h2>The Situation</h2>
          <p data-test="ch6-sit-text">${sit.text}</p>
          <p class="key">${KEY_MARK}<b data-test="ch6-need">Needs: ${nf(sit.need)} tokens</b></p>
          <button type="button" class="sitslot" data-zone="sit" data-drop data-test="ch6-slot-${n}">Drop a setting here</button></div>
        <p class="lab">The 3 Settings</p>
        <div class="rack setrack"><div class="rack-tiles" role="group" aria-label="Settings">${SETS.map(o=>tile(o,n,sit)).join('')}</div><div class="rack-lip" aria-hidden="true"></div></div>
        <p class="key">${KEY_BAR}<span>The brown bar is the room in the KV-Cache (the stack of notes) with this setting.</span></p>
        <p class="key">${KEY_MARK}<span>The gold line is the tokens that the situation needs. A setting fits when its bar reaches the gold line.</span></p>
      </div>
      <div class="rule" data-rule data-test="ch6-rule-${n}" aria-live="polite"></div>
    </div>
    <div class="verdict good what" data-what="${n}" data-test="ch6-what-${n}" hidden><h2>What Happened</h2>${sit.what}</div>
    ${n===3?'<div class="endcard" data-end data-test="ch6-end" hidden></div>':''}
    ${navRow(G,n)}
  </section>`; }).join('')+`
  <details class="fold" data-steps="1 2 3"><summary>Where the Numbers Come From</summary><ul>
    <li>The token counts come from <code>verify.py</code> on an RTX 5080 graphics card (16 GB), with <code class="nw">--gpu-memory-utilization 0.85</code>.</li>
    <li>Your counts can differ by about 10%. In Chapter 6 of the tutorial, the vLLM server shows room for 120,000 tokens with ${C4}.</li>
    <li>The speeds were measured with about 16,000 tokens in the KV-Cache.</li>
    <li>The vLLM authors measured the answer quality. Perplexity went up 2.71% with ${C4} and 10.63% with ${C3}. Perplexity scores how well a model predicts text. A larger increase means that the answers move farther from the model without TurboQuant.</li>
    <li>Each chat stays below 32,768 tokens. This is the <code class="nw">--max-model-len</code> value in Chapter 6 of the tutorial.</li>
    <li>The 3 situations are examples. The tutorial does not measure them.</li>
  </ul></details>`;

  const award=()=>api.stars([1,2,3].map(n=>!!S.done[n]));
  const smooth=()=>api.rm()?'auto':'smooth';
  const into=el=>{ if(!api.replaying) el.scrollIntoView({block:el.getBoundingClientRect().height>innerHeight-28?'start':'nearest',behavior:smooth()}); };
  const syncSel=n=>$('.sit',step(n)).classList.toggle('sel-on',!!$('[data-set][aria-pressed="true"]',step(n)));
  function card(n,kind,o){
    const sit=SITS[n-1]; let cls='', top='Drag a setting onto the situation.', body='';
    if(kind==='start') body='<p data-test="ch6-start">Use the rule: pick the fastest setting that fits.</p>';
    else if(kind==='sel') top='Now tap the situation.';
    else if(kind==='nosel') top='Tap a setting first.';
    else if(kind==='down') top='Put back. Pick any setting.';
    else if(kind==='wrong'){
      const why=o.holds<sit.need
        ?`This setting does not fit. The situation needs ${nf(sit.need)} tokens, and ${o.html} holds ${nf(o.holds)} tokens.`
        :`This setting fits, but a faster setting also fits. With ${o.html}, the model writes ${o.tps} tokens per second.`;
      cls='bad'; top='Not this one.';
      body=`<div data-test="ch6-hint"><p>${why}</p>${S.miss[n]>1?'<p>Look for the fastest setting whose bar reaches the gold line.</p>':''}</div>`;
    }
    else if(kind==='right'){
      cls='good'; top=`Right: ${o.name}.`;
      body=`<p data-test="ch6-why">${sit.why}</p><p>You earned the star.</p>`;
    }
    hintCard($('[data-rule]',step(n)),cls,top,body);
  }
  function endCard(){
    const e=$('[data-end]',root);
    e.innerHTML=`<p class="big">Game complete. Stars: ${[1,2,3].filter(n=>S.done[n]).length} of 3.</p>
      <h2>Why ${C3} Never Won</h2>
      <p>${C3} is the strongest setting. It holds about ${Math.round((K3.holds/NC4.holds-1)*100)}% more tokens than ${C4}. But the model writes more slowly with it, and its answers move farther from the model without TurboQuant. Use it only when the work fits in no other setting.</p>
      <div class="row"><button type="button" class="btn t" data-again data-test="ch6-again">Play again</button><a class="btn next" href="verify-game.html" data-test="ch6-extra">Extra game: Is It Actually On?</a></div>`;
    e.hidden=false;
  }
  function tryPick(d){
    const n=d.s, sit=SITS[n-1], o=SETS.find(x=>x.k===d.k);
    if(!sit||!o||S.done[n]) return;
    const t=step(n), slot=$('[data-drop]',t);
    if(o.k!==sit.right){
      S.miss[n]=(S.miss[n]||0)+1; syncSel(n);
      card(n,'wrong',o); api.say('Not this one.');
      if(!api.rm()){ slot.classList.remove('shake'); void slot.offsetWidth; slot.classList.add('shake'); }
      if(!api.replaying) $(`[data-set="${o.k}"]`,t).focus({preventScroll:true});
      return;
    }
    S.done[n]=true;
    $$('[data-set]',t).forEach(b=>{ b.disabled=true; b.setAttribute('aria-pressed','false'); b.classList.toggle('won',b===$(`[data-set="${o.k}"]`,t)); });
    syncSel(n);
    slot.innerHTML=`${ICON.check}<span data-test="ch6-placed-${n}">${o.html}</span>`; slot.classList.add('ok'); slot.disabled=true;
    slot.setAttribute('aria-label',`${o.name} is on the situation`);
    card(n,'right',o); award();
    api.later(()=>{
      const w=$(`[data-what="${n}"]`,t); w.hidden=false;
      const said=$$('p',w).map(p=>p.textContent).join(' ');
      if(n<SITS.length){ const b=$(`[data-next="${n+1}"]`,root); b.disabled=false; if(!api.replaying) b.focus(); }
      else{
        api.finish(); endCard();
        const e=$('[data-end]',t);
        if(e.getBoundingClientRect().bottom-w.getBoundingClientRect().top<=innerHeight-28) into(e);
        else if(!api.replaying) w.scrollIntoView({block:'start',behavior:smooth()});
      }
      api.say(said);
    },2000);
  }

  const drop=el=>api.do('pick',{s:+el.closest('.step').dataset.step,k:el.dataset.set});
  enableDrag(root,'[data-set]','[data-zone="sit"]',drop,true);
  enableTap(root,'[data-set]','[data-zone="sit"]',drop,(kind,el)=>{
    const n=+$('.step:not([hidden])',root).dataset.step;
    if(S.done[n]) return;
    syncSel(n); card(n,kind);
  });
  SITS.forEach((_,i)=>card(i+1,'start'));
  return {
    apply(type,d){ if(type==='pick') tryPick(d); },
    ready(){ award(); }
  };
}

renderSaved();
route(true);
})();
</script>
