      rule('right',{term,slot,done});
      if(done){ award(); $('[data-next="2"]',root).disabled=false; api.say('Right. All six matched. You earned a star this round!'); if(!api.replaying) $('[data-next="2"]',root).focus(); }
      else{ api.say(`Right: ${term.label} = ${plain(slot.name)}.`); if(!api.replaying){ const n=$('[data-term]',root); if(n) n.focus(); } }
    }else{
      S.missed[term.id]=(S.missed[term.id]||0)+1; S.sel=null; renderRack();
      const b=$(`[data-slot="${slot.id}"]`,root);
      if(!api.rm()){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
      rule('wrong',{term});
      api.say('Not this one.');
      if(!api.replaying){ const t=$(`[data-term="${term.id}"]`,root); if(t) t.focus({preventScroll:true}); }
    }
  }

  /* step 2 */
  function placeBook(){
    if(S.book) return; S.book=true;
    const t=step(2);
    $('[data-ph]',t).hidden=true; $('[data-bigtile]',t).hidden=false;
    $('[data-do="book"]',t).hidden=true;
    const p=$('[data-predict]',t); p.hidden=false;
    if(!api.replaying){ $('.q',p).focus({preventScroll:true}); p.scrollIntoView({block:'nearest',behavior:api.rm()?'auto':'smooth'}); }
    api.say('Recipe book placed: 7.6 GB. It never grows. How much of the table is left for notes?');
  }
  function predict(k){
    if(S.pred||!S.book||!['most','third','none'].includes(k)) return; S.pred=k;
    const t=step(2), p=$('[data-predict]',t);
    $$('[data-pick]',p).forEach(b=>{
      b.disabled=true; b.setAttribute('aria-pressed',String(b.dataset.pick===k));
      if(b.dataset.pick==='third'){ b.classList.add('right'); b.insertAdjacentHTML('afterbegin','<span class="mk" aria-hidden="true">✓</span>'); }
      else if(b.dataset.pick===k){ b.classList.add('wrong'); b.insertAdjacentHTML('afterbegin','<span class="mk" aria-hidden="true">✗</span>'); }
    });
    $('[data-noteval]',t).textContent='5.3 GB'; $('.p2',t).classList.add('hl');
    const v=$('[data-verdict]',p); v.hidden=false;
    if(k==='third'){ v.className='verdict good'; v.innerHTML='<p><b>Right: about a third.</b> 5.3 of the 16 GB is left for notes.</p>'+STARLINE; }
    else{ v.className='verdict bad'; v.innerHTML='<p><b>Not quite. About a third is left: 5.3 of the 16 GB.</b></p><p data-why>The recipe book takes 7.6 GB, almost half the table. Another 3.1 GB stays clear for other work.</p>'; }
    award();
    $('[data-next="3"]',root).disabled=false;
    api.say($$('p',v).map(p=>p.textContent).join(' '));
  }

  /* step 3 */
  function talk(id){
    const m=MSG.find(x=>x.id===id);
    if(!m||S.full||S.used.includes(id)) return;
    S.used.push(id); S.total=Math.round((S.total+m.add)*10)/10;
    const t=step(3), c=$(`[data-card="${id}"]`,t);
    c.disabled=true; c.classList.add('used'); $('[data-state]',c).textContent='Added';
    const cells=$$('.n',t), from=S.cells, to=Math.min(60,Math.max(from+1,Math.ceil(S.total*0.6)));
    for(let k=from;k<to;k++){ const n=cells[k]; n.classList.add('f'); if(!api.rm()){ n.classList.add('new'); n.style.animationDelay=Math.min((k-from)*25,600)+'ms'; } }
    S.cells=to;
    const pct=S.total, txt=(pct<10?pct.toFixed(1):Math.round(pct))+'%';
    const gb=5.3*Math.min(pct,100)/100;
    $('[data-noteval]',t).textContent=`${gb<0.1?gb.toFixed(2):gb.toFixed(1)} of 5.3 GB`;
    const meter=$('[data-meter]',t); meter.dataset.value=String(pct);
    if(pct<=100){
      meter.textContent=`Room for notes used: ${txt}`;
      api.say(`Added: ${m.name}. Room for notes used: ${txt}.`);
      if(!api.replaying){ const n=$('[data-card]:not(:disabled)',t); if(n) n.focus({preventScroll:true}); }
      return;
    }
    S.full=true;
    meter.textContent=`Room for notes used: ${txt}. It does not fit.`;
    $('.p2',t).classList.add('over'); $('[data-stamp]',t).hidden=false;
    $$('[data-card]:not(:disabled)',t).forEach(b=>{ b.disabled=true; b.classList.add('locked'); $('[data-state]',b).textContent='No room left'; });
    api.later(()=>{
      const full=$('[data-full]',t); full.hidden=false;
      award(); api.finish(); endCard();
      if(!api.replaying){ full.focus({preventScroll:true}); full.scrollIntoView({block:'nearest',behavior:api.rm()?'auto':'smooth'}); }
      api.say('The table is full. The chef must stop, discard older notes, move them somewhere slower, or use a shorter conversation.');
    },900);
  }
  function endCard(){
    const e=$('[data-end]',root);
    e.innerHTML=`<div data-end-head>${endHead(api.G)}</div>
      <p>The model weights (the recipe book) load one time and stay the same size: 7.6 GB. The KV-Cache (the stack of notes) grows with each token in the chat.</p><p>Both must fit in the same GPU memory (the table). In this game, the notes have 5.3 GB of room. When that room is full, the chat cannot continue. Chapter 2 shows why the model keeps these notes.</p>
      <div class="row"><button type="button" class="btn t" data-again data-test="ch1-again">Play again</button><a class="btn next" href="#ch2/1" data-test="ch1-next-game">Next game: Ch 2 Fundamentals of KV-Caching</a></div>`;
    e.hidden=false;
  }

  root.addEventListener('click',e=>{
    if(justDragged) return;
    const el=e.target.closest('button'); if(!el||el.disabled||!root.contains(el)) return;
    if(el.dataset.term) return select(el.dataset.term);
    if(el.dataset.slot) return clickSlot(el.dataset.slot);
    if(el.dataset.pick) return api.do('pred',el.dataset.pick);
    if(el.dataset.do==='book') return api.do('book');
    if(el.dataset.card) return api.do('talk',el.dataset.card);
  });
  enableDrag(root,'[data-term]','[data-slot]:not(.ok), [data-zone="back"]',(el,z)=>{ if(z.dataset.slot) api.do('try',{t:el.dataset.term,s:z.dataset.slot}); });
  enableDrag(root,'[data-do="book"]','[data-zone="book"]',()=>api.do('book'));
  enableDrag(root,'[data-card]','[data-zone="notes"]',el=>api.do('talk',el.dataset.card));

  rule('start');
  return {
    apply(type,d){
      if(type==='order'){ S.order=d; renderRack(); }
      else if(type==='try') tryMatch(d);
      else if(type==='book') placeBook();
      else if(type==='pred') predict(d);
      else if(type==='talk') talk(d);
    },
    ready(){
      if(!S.order){
        let o=shuffle(TERMS.map(t=>t.id));
        while(o.every((x,i)=>x===TERMS[i].id)) o=shuffle(o);
        api.do('order',o);
      }
      if(S.last!=='right'&&S.last!=='wrong') rule('start');
      award();
    }
  };
}

/* ================= Ch 2 · The chef's notes ================= */
function buildCh2(api){
  const G=api.G, root=api.root;
  const WORDS='Add the garlic, stir it slowly, then taste before you add salt.'.split(' ');
  const N=WORDS.length, TICK=300, LIMIT=38544, LOW=34690, ROOM=5.3, BOOK=7.6, CLEAR=3.1;
  const EV=[]; for(let n=1;n<=N;n++){ for(let i=0;i<n-1;i++) EV.push([n,i]); EV.push([n,-1]); }
  const HINT={
    low:['The table still has room. Look at the Room Left bar.','Move the slider to the right until Room Left is almost 0 GB.'],
    high:['The table is over its limit. The Whole Table bar is red.','Move the slider to the left until the Whole Table bar is not red.']};
  const S={raced:false,running:false,run:0,tok:8000,found:false,missed:{low:0,high:0},kind:''};
  const step=n=>$(`.step[data-step="${n}"]`,root);
  const fmt=n=>n.toLocaleString('en-US');
  const lane=(k,name)=>`<div class="lane" data-lane="${k}"><h2>${name}</h2>
      <div class="words" aria-hidden="true">${WORDS.map(w=>`<span class="w"><span>${w}</span></span>`).join('')}</div>
      <p class="count">Tokens processed: <span data-count data-test="ch2-count-${k}">0</span></p>
      <p class="fine">Notes saved: <span data-notes data-test="ch2-notes-${k}">0</span></p></div>`;
  const bar=(k,name)=>`<div class="bar-row"><p class="bar-lab">${name}<span data-val="${k}" data-test="ch2-bar-${k}"></span></p><div class="bar" data-bar="${k}" aria-hidden="true">${k==='table'?'<i class="f-book"></i><i class="f-clear"></i><i class="f-notes"></i>':`<i class="f-${k}"></i>`}</div></div>`;

  root.innerHTML=`
  <section class="step" data-step="1" hidden>
    ${head(G,1,{learn:'<b>KV-Caching</b> saves work. The chef reads <b>saved notes</b> and does not re-read the earlier tokens.',do:['<b>Press Start.</b>','Watch how many tokens each chef must process to write the same sentence.']})}
    <p class="racecap" data-cap data-test="ch2-cap"></p>
    <div class="row"><button type="button" class="btn t" data-do="start" data-test="ch2-start">Start</button><button type="button" class="btn ghost" data-do="skip" data-test="ch2-skip">Skip to finish</button></div>
    <p class="sr-only">Both chefs write this sentence: ${WORDS.join(' ')}</p>
    <div class="race">${lane('std','Standard Inference')}${lane('kv','KV-Caching')}</div>
    <p class="fine">To keep this race simple, each word is 1 token. In real text, 1 token is about three quarters of a word.</p>
    <div class="verdict good" data-verdict data-test="ch2-race-verdict" hidden><p><b>Both chefs (LLMs) wrote the same ${N} words.</b> Standard inference processed ${EV.length} tokens. KV-Caching processed ${N}.</p><p>The cost: ${N} notes on the table. The notes use GPU memory.</p>${STARLINE}</div>
    ${navRow(G,1)}
  </section>

  <section class="step has-hint" data-step="2" hidden>
    ${head(G,2,{learn:'Each <b>token</b> adds one <b>note</b> to the table. The notes grow until <b>GPU memory</b> is full.',do:['<b>Move</b> the slider.','<b>Stop at the largest number of tokens</b> that still fits.','Then <b>press Check.</b>']})}
    <div class="s1">
      <div>
        <p class="q">How many tokens fit before GPU memory is full?</p>
        <div class="tokrow"><label class="tok" for="ch2-range">Tokens in the conversation: <span data-tok data-test="ch2-tok"></span></label><span class="small-steps" data-test="ch2-small">Use − and + for small steps.</span></div>
        <div class="slide"><button type="button" class="btn t" data-step-by="-500" aria-label="500 fewer tokens" data-test="ch2-minus">−</button><input type="range" id="ch2-range" min="1000" max="100000" step="500" value="8000" data-range data-test="ch2-slider"><button type="button" class="btn t" data-step-by="500" aria-label="500 more tokens" data-test="ch2-plus">+</button></div>
        <div class="tb bars">
          <h2>16 GB Table (GPU Memory)</h2>
          <div class="ruler" aria-hidden="true"><span>0</span><span style="left:25%">4</span><span style="left:50%">8</span><span style="left:75%">12</span><span style="left:100%">16 GB</span></div>
          ${bar('book','Recipe Book')}${bar('notes','Notes')}${bar('room','Room Left')}${bar('table','Whole Table')}
          <p class="bar-sub" data-sum data-test="ch2-sum"></p>
        </div>
        <div class="row"><button type="button" class="btn t" data-do="check" data-test="ch2-check">Check</button></div>
      </div>
      <div class="rule" data-rule data-test="ch2-rule" aria-live="polite"></div>
    </div>
    <div class="full info" data-full tabindex="-1" data-test="ch2-full" hidden>
      <p class="big">The table is full at 38,544 tokens.</p>
      <p>When the table is full, the LLM must stop, discard older notes, move them somewhere slower, or use a shorter conversation.</p>
    </div>
    <div class="endcard" data-end data-test="ch2-end" hidden></div>
    ${navRow(G,2)}
  </section>`;

  const starsNow=()=>[S.raced, S.found];
  const award=()=>api.stars(starsNow());

  /* step 1 */
  function setLane(k,written,count,notes,read){
    const L=$(`[data-lane="${k}"]`,root);
    $$('.w',L).forEach((w,i)=>{ w.classList.toggle('on',i<written); w.classList.toggle('read',i===read); });
    $('[data-count]',L).textContent=count; $('[data-notes]',L).textContent=notes;
  }
  function frame(ri,ni){
    const e=ri?EV[ri-1]:null;
    setLane('std',e?(e[1]<0?e[0]:e[0]-1):0,ri,0,e&&e[1]>=0?e[1]:-1);
    setLane('kv',ni,ni,ni,-1);
    $('[data-cap]',root).textContent=!e?'Press Start. Watch how many tokens each chef must process.'
      :ri>=EV.length?'The race is over.'
      :`Word ${e[0]}: Standard inference re‑reads ${e[0]-1} ${e[0]===2?'token':'tokens'}, then writes.${ni<N?' KV‑Caching reads its notes, then writes.':` KV‑Caching has finished all ${N} words.`}`;
  }
  function btns(){
    const t=step(1), a=$('[data-do="start"]',t);
    a.textContent=S.raced?'Run again':'Start'; a.disabled=S.running; a.hidden=S.raced&&prefersRM();
    $('[data-do="skip"]',t).hidden=S.raced&&!S.running;
  }
  function start(){
    if(S.running) return;
    if(api.rm()){ if(!S.raced) api.do('race'); return; }
    S.running=true; btns();
    const run=++S.run; let ri=0, ni=0;
    (function tick(){
      if(run!==S.run||!root.isConnected) return;
      ri++; if(ni<N) ni++;
      frame(ri,ni);
      if(ri<EV.length) setTimeout(tick,TICK);
      else if(S.raced) raced(); else api.do('race');
    })();
  }
  function raced(){
    const first=!S.raced;
    S.raced=true; S.running=false; S.run++;
    frame(EV.length,N); btns();
    const v=$('[data-verdict]',step(1)), next=$('[data-next="2"]',root);
    v.hidden=false; next.disabled=false;
    award();
    if(first){ api.say($$('p',v).map(p=>p.textContent).join(' ')); if(!api.replaying) next.focus(); }
  }

  /* step 2 */
  function bars(v){
    const t=step(2), notes=v*ROOM/LIMIT, room=Math.max(0,ROOM-notes), over=v>LIMIT;
    const pc=gb=>Math.min(100,gb/16*100)+'%';
    const r=$('[data-range]',t); if(+r.value!==v) r.value=v;
    r.setAttribute('aria-valuetext',`${fmt(v)} tokens`);
    $('[data-tok]',t).textContent=fmt(v);
    $('[data-val="book"]',t).textContent=`${BOOK} GB (never changes)`;
    $('[data-val="notes"]',t).textContent=`${notes.toFixed(1)} GB`;
    $('[data-val="room"]',t).textContent=`${room.toFixed(1)} GB`;
    $('[data-val="table"]',t).textContent=`${(BOOK+CLEAR+notes).toFixed(1)} of 16 GB${over?'. It does not fit.':''}`;
    $('[data-bar="book"] i',t).style.width=pc(BOOK);
    $('[data-bar="notes"] i',t).style.width=pc(notes);
    $('[data-bar="room"] i',t).style.width=pc(room);
    const tb=$('[data-bar="table"]',t); tb.classList.toggle('over',over);
    $('.f-book',tb).style.width=pc(BOOK); $('.f-notes',tb).style.width=pc(notes);
    $('[data-sum]',t).textContent=`Recipe book ${BOOK} GB + notes ${notes.toFixed(1)} GB + kept clear ${CLEAR} GB`;
  }
  function card(kind){
    let cls='', top='Move the slider. Then press Check.', body='';
    if(kind==='wrong'){
      const n=S.missed[S.kind], h=HINT[S.kind];
      cls='bad'; top='Not yet.';
      body=`<div data-test="ch2-hint">${n===1?`<p>${h[0]}</p>`:n===2?`<p>${h[1]}</p>`:`<p>${h[0]}</p><p>${h[1]}</p><p><b>Try again.</b></p>`}</div>`;
    }
    else if(kind==='right'){
      cls='good'; top='Right: 38,544 tokens fit.';
      body='<p data-why data-test="ch2-why">That is about 29,000 words.</p>'+STARLINE;
    }
    hintCard($('[data-rule]',root),cls,top,body);
  }
  function check(v){
    if(S.found) return;
    S.tok=v; bars(v);
    if(v<LOW||v>LIMIT){
      S.kind=v<LOW?'low':'high'; S.missed[S.kind]++;
      card('wrong'); api.say('Not yet.');
      return;
    }
    S.found=true;
    const t=step(2), full=$('[data-full]',t);
    $('[data-range]',t).disabled=true;
    $$('[data-step-by], [data-do="check"]',t).forEach(b=>{ b.disabled=true; });
    card('right'); award();
    full.hidden=false; api.finish(); endCard();
    if(!api.replaying){ full.focus({preventScroll:true}); full.scrollIntoView({block:'nearest',behavior:api.rm()?'auto':'smooth'}); }
    api.say('Right: 38,544 tokens fit. That is about 29,000 words.');
  }
  function endCard(){
    const e=$('[data-end]',root);
    e.innerHTML=`<div data-end-head>${endHead(api.G)}</div>
      <p>KV-Caching saves work. The model keeps notes on the tokens that it already read, so it does not read the full chat again for each new token.</p><p>The notes use GPU memory. In this game, the notes have room for 38,544 tokens (about 29,000 words). Chapter 3 shows how TurboQuant makes each note smaller.</p>
      <div class="row"><button type="button" class="btn t" data-again data-test="ch2-again">Play again</button><a class="btn next" href="#ch3/1" data-test="ch2-next-game">Next game: Ch 3 TurboQuant 101</a></div>`;
    e.hidden=false;
  }

  const range=$('[data-range]',root);
  range.addEventListener('input',()=>bars(+range.value));
  range.addEventListener('change',()=>api.do('set',+range.value));
  root.addEventListener('click',e=>{
    const el=e.target.closest('button'); if(!el||el.disabled||!root.contains(el)) return;
    if(el.dataset.do==='start') return start();
    if(el.dataset.do==='skip') return S.raced?raced():api.do('race');
    if(el.dataset.do==='check') return api.do('check',+range.value);
    if(el.dataset.stepBy) return api.do('set',Math.max(1000,Math.min(100000,+range.value+ +el.dataset.stepBy)));
  });

  frame(0,0); btns(); bars(S.tok); card('start');
  return {
    apply(type,d){
      if(type==='race') raced();
      else if(type==='set'){ if(!S.found){ S.tok=d; bars(d); } }
      else if(type==='check') check(d);
    },
    ready(){ award(); }
  };
}

/* ================= Ch 3 · Shorthand school ================= */
const TOY=(function(){ let c=null; return function(){ if(c) return c;
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function gauss(rng){let u=0,v=0;while(!u)u=rng();while(!v)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
  const D=64,NC=32,PER=8,NK=NC*PER,NQ=384,OUT=[3,17,31,45];
  const rng=mulberry32(1234);
  const centers=Array.from({length:NC},()=>Float64Array.from({length:D},()=>gauss(rng)));
  const base=[]; for(const ce of centers)for(let p=0;p<PER;p++) base.push(Float64Array.from({length:D},(_,i)=>ce[i]+gauss(rng)*0.15));
  const signs=Float64Array.from({length:D},()=>rng()<0.5?-1:1);
  const qNoise=Array.from({length:NQ},()=>Float64Array.from({length:D},()=>gauss(rng)*0.1));
  const qT=Array.from({length:NQ},(_,i)=>i%NK);
  function wht(v){const y=Float64Array.from(v);for(let len=1;len<D;len<<=1)for(let i=0;i<D;i+=len<<1)for(let j=i;j<i+len;j++){const a=y[j],b=y[j+len];y[j]=a+b;y[j+len]=a-b;}const s=1/Math.sqrt(D);for(let i=0;i<D;i++)y[i]*=s;return y}
  function rotFwd(v){const t=new Float64Array(D);for(let i=0;i<D;i++)t[i]=v[i]*signs[i];return wht(t)}
  function rotInv(v){const t=wht(v);for(let i=0;i<D;i++)t[i]*=signs[i];return t}
  const mx=v=>{let m=0;for(const x of v)m=Math.max(m,Math.abs(x));return m};
  function quant(v,bits){const L=1<<bits,m=mx(v);if(!m)return Float64Array.from(v);
    const step=2*m/L,out=new Float64Array(D);for(let i=0;i<D;i++){let k=Math.floor((v[i]+m)/step);k=Math.max(0,Math.min(L-1,k));out[i]=-m+(k+0.5)*step;}return out}
  function spotIdx(v,bits){const L=1<<bits,m=mx(v),step=2*m/L;return Array.from(v,x=>Math.max(0,Math.min(L-1,Math.floor((x+m)/step))))}
  function dot(a,b){let s=0;for(let i=0;i<D;i++)s+=a[i]*b[i];return s}
  function test(deq){const dn=deq.map(v=>Math.sqrt(dot(v,v))||1),miss=[];let ch=0;
    for(let qi=0;qi<NQ;qi++){const t=qT[qi],q=new Float64Array(D);for(let i=0;i<D;i++)q[i]=notes[t][i]+qNoise[qi][i];
      const s=dot(q,notes[t]);ch+=Math.abs(dot(q,deq[t])-s)/Math.abs(s);
      let best=-1,bv=-Infinity;for(let k=0;k<NK;k++){const d=dot(q,deq[k])/dn[k];if(d>bv){bv=d;best=k}}if(best!==t)miss.push(qi)}
    return {miss,shift:ch/NQ}}
  const gap=(a,b)=>{let s=0,g=0;for(let i=0;i<D;i++){const d=Math.abs(a[i]-b[i]);s+=d;g=Math.max(g,d)}return [s/D,g]};
  const notes=base.map(k=>{const v=Float64Array.from(k);for(const i of OUT)v[i]*=4;return v});
  const before=notes[0], after=rotFwd(before), rounded=quant(after,3), m=mx(after), mb=mx(before), plain=quant(before,3);
  const grid=x=>Array.from({length:8},(_,k)=>-x+(k+0.5)*(2*x/8));
  const ratio=notes.map(k=>{const r=rotFwd(k),q=quant(r,3);return Math.sqrt(dot(q,q)/dot(r,r))});
  const tests=[notes,notes.map(k=>quant(k,3)),notes.map(k=>rotInv(quant(rotFwd(k),3)))].map(test);
  c={OUT,NQ,NK,before,after,rounded,idx:spotIdx(after,3),vals:grid(m),max:[mb,m],typ:after.reduce((s,v)=>s+Math.abs(v),0)/D,noRot:{rounded:plain,vals:grid(mb)},
    len:[Math.sqrt(dot(after,after)),Math.sqrt(dot(rounded,rounded))],lenRange:[Math.min(...ratio),Math.max(...ratio)],
    gap:gap(after,rounded),gapNoRot:gap(before,plain),
    score:tests.map(t=>NQ-t.miss.length),miss:tests.map(t=>t.miss),shift:tests.map(t=>t.shift)};
  return c;
}})();

const PLOT={W:480,H:214,B:200,L:22,R:458};
const plotX=(v,M)=>PLOT.L+(v+M)/(2*M)*(PLOT.R-PLOT.L);
const plotTicks=(M,list)=>`<div class="ticks" aria-hidden="true">${list.map(t=>`<span style="left:${(plotX(t,M)/PLOT.W*100).toFixed(2)}%">${String(t).replace('-','−')}</span>`).join('')}</div>`;
function makePlot(host,M,ticks,ghost){
  const {W,H,B,L,R}=PLOT, d=9, X=v=>plotX(v,M);
  host.innerHTML=`<svg class="plot" viewBox="0 0 ${W} ${H}" role="img"><line class="ax" x1="${L}" x2="${R}" y1="${B+1}" y2="${B+1}"/><g>${`<line class="gl" x1="0" x2="0" y1="26" y2="${B+1}"/>`.repeat(8)}</g>${ghost?`<g hidden>${'<circle class="ghost"/>'.repeat(64)}</g>`:''}<g>${Array.from({length:64},(_,i)=>`<g class="dot" style="--i:${i}"><circle r="4.1"/><path d="M0 -6L6 0 0 6-6 0Z"/></g>`).join('')}</g></svg>${plotTicks(M,ticks)}`;
  const svg=host.firstChild, gls=$$('.gl',svg), dots=$$('.dot',svg), ghosts=$$('.ghost',svg);
  return {set(s,instant){
    if(instant) svg.classList.add('noanim');
    const n=s.vals.length, ord=[...Array(n).keys()].sort((a,b)=>s.vals[a]-s.vals[b]);
    const cols=at=>{ const p=new Array(n), cnt={}; for(const i of ord){ const k=s.idx[i], j=(cnt[k]=(cnt[k]||0)+1)-1; p[i]=[X(at[k])+((j%3)-1)*d,B-6-Math.floor(j/3)*d]; } return p; };
    let pos;
    if(s.idx) pos=cols(s.at||s.grid);
    else{ pos=new Array(n); const placed=[]; for(const i of ord){ const x=X(s.vals[i]); let row=0; while(placed.some(p=>p[1]===row&&Math.abs(p[0]-x)<d)) row++; placed.push([x,row]); pos[i]=[x,B-6-row*d]; } }
    const rad=i=>s.pick&&s.pick.includes(i)?6:s.ring?3.6:4.1;
    dots.forEach((g,i)=>{
      g.style.transform=`translate(${pos[i][0].toFixed(1)}px,${pos[i][1].toFixed(1)}px)`;
      g.classList.toggle('out',!!s.out&&s.out.includes(i)); g.classList.toggle('pick',rad(i)===6);
      g.firstChild.setAttribute('r',rad(i));
    });
    svg.classList.toggle('mix',!!s.ring);
    if(ghosts.length){
      ghosts[0].parentNode.toggleAttribute('hidden',!s.ghost);
      if(s.ghost){ const old=cols(s.grid); ghosts.forEach((c,i)=>{ c.setAttribute('cx',old[i][0].toFixed(1)); c.setAttribute('cy',old[i][1].toFixed(1)); c.setAttribute('r',rad(i)); }); }
    }
    gls.forEach((l,k)=>{ l.style.display=s.grid?'':'none'; if(s.grid){ const x=X(s.grid[k]).toFixed(1); l.setAttribute('x1',x); l.setAttribute('x2',x); } });
    svg.setAttribute('aria-label',s.label);
    if(instant){ void svg.getBoundingClientRect(); requestAnimationFrame(()=>svg.classList.remove('noanim')); }
  }};
}

function buildCh3(api){

  const NUMS=PICK.map(i=>{
    const v=r2(T.after[i]), k=T.idx[i], to=r2(T.vals[k]), other=r2(T.vals[v>to?k+1:k-1]);
    return {i,k,txt:f2(v),to:f2(to),nc:f2(T.rounded[i]*F),lo:f2(Math.min(to,other)),hi:f2(Math.max(to,other)),gap:f2(Math.abs(v-to))};
  });

  const TESTS=[

  <section class="step" data-step="1" hidden>

    ${navRow(G,1)}
  </section>

  <section class="step has-hint" data-step="2" hidden>
    ${head(G,2,{learn:'<b>Rounding</b> (<b>quantization</b>) stores each number of the KV-Cache vector (note) in less GPU memory. A <b>bit</b> is the smallest unit of memory: one 0 or 1. The original number uses 16 bits. Round keeps only 3 bits, and 3 bits can name only 8 different values. So Round replaces each number with the closest of 8 <b>allowed values</b>.',do:['Drag each of the 3 numbers onto its closest allowed value. Or tap a number, then tap a value.','<b>Press Round the rest</b> to round the other 61 numbers.']})}
    <div class="s1">
      <div>
        <div class="tb"><h2>The KV-Cache Vector After Rotate</h2>

        <p class="lab">The 8 Allowed Values and Their 3-Bit Codes</p>
        <div class="vals" role="group" aria-label="Allowed values">${T.vals.map((v,k)=>`<button type="button" class="vtile" data-zone="val" data-v="${k}" data-test="ch3-val-${k}"><span class="vslot"></span><span>${f2(v)}</span><span class="vcode">${k.toString(2).padStart(3,'0')}</span></button>`).join('')}</div>

    </div>

  </section>

  <section class="step" data-step="3" hidden>
    ${head(G,3,{learn:'The previous step, <b>Round</b>, moved each number in the KV-Cache vector (note) to an allowed value. The distance that a number moved is its <b>quantization error</b>. The model reads the rounded numbers each time it writes a new token. If the errors are small, the model finds the same earlier tokens and gives the same answer. If the errors are large, the model can read the wrong earlier tokens.',do:['<b>Press Compare.</b>','Look at the <span class="c-red">red lines</span>. A <span class="c-red">red line</span> shows how far the Round step moved a number, from its original value to its allowed value.','Find the longest <span class="c-red">red line</span>. A longer line means a larger error for that number.']})}

    <div class="race" data-norot tabindex="-1" data-test="ch3-norot-out" hidden>

        <p data-beat="1" hidden><b>1. Measure.</b> Length after quantization (Round): ${LEN[1]}. The game squares each of the 64 numbers, adds the squares, and takes the square root. The <span class="c-gray">dark gray bar</span> shows this length.</p>

    <div class="race" data-fix data-test="ch3-fix" hidden>

      <div class="lane" data-test="ch3-fix-vllm"><h2>The Fix in vLLM: Norm Correction</h2><p>vLLM is the software in Chapter 4. Before Round, vLLM stores the length of each vector (the norm). After Round, it multiplies every number in the vector by one factor, and the vector gets its original length back.</p><p>Why vLLM does not use the correction mark: at least five independent groups found that the correction mark hurt answer quality. It adds small random errors, and the attention step of the model magnifies them.</p></div>

  </section>

  <section class="step" data-step="5" hidden>

    ${what(5,`<p><b>Round only missed ${MISS[1]} of the ${NQ} lookups. Rotate + Round missed ${MISS[2]}.</b></p><p>Rotate cut the misses from ${MISS[1]} to ${MISS[2]}. Both methods use 3 bits for each number.</p><p>How a miss happens: Round changed the numbers of each vector. Then a similar vector scored higher than the right one.</p><h2>Why This Matters</h2><p>Each time the model writes a token, it must find the earlier tokens that matter. A miss means that the model reads the wrong part of the conversation.</p><p>With Rotate + Round, the KV-Cache vectors (notes) use much less GPU memory, and the model still finds almost every one.</p><p>Chapter 5 of the tutorial tests this on the real model. Qwen finds a hidden password with and without TurboQuant, and the KV-Cache holds about 2.9 times more tokens.</p>`)}
    <div class="endcard" data-end data-test="ch3-end" hidden></div>
    ${navRow(G,5)}

  const starsNow=()=>[S.rot,S.rest,S.cmp,S.nc,S.test];

  const open=n=>{ const b=$(`[data-next="${n}"]`,root); b.disabled=false; if(!api.replaying) b.focus(); };

  const plots={
    before:makePlot($('[data-plot="before"]',root),8,TK8),
    after:makePlot($('[data-plot="after"]',root),8,TK8),
    round:makePlot($('[data-plot="round"]',root),4.2,TK4),
    nc:makePlot($('[data-plot="nc"]',root),4.2,TK4,true)};
  const ROUND={vals:T.after,grid:T.vals,pick:PICK};
  function gapChart(name,o){
    const X=v=>plotX(v,o.M).toFixed(1), ord=[...o.vals.keys()].sort((a,b)=>o.vals[a]-o.vals[b]), h=o.hide?' data-gap hidden':'';

      const y=(9+r*3.1).toFixed(1), a=X(o.vals[i]), b=X(o.rounded[i]);
      return `<line class="gapl"${h} x1="${a}" x2="${b}" y1="${y}" y2="${y}"/><circle class="orig"${h} cx="${a}" cy="${y}" r="2.2"/><circle class="rdot" cx="${b}" cy="${y}" r="2.4"/>`;
    }).join('')}</svg>${plotTicks(o.M,o.ticks)}`;
  }
  const WITH={vals:T.after,rounded:T.rounded,grid:T.vals};
  gapChart('gap',{...WITH,M:4.2,ticks:TK4,hide:true,label:'The rounded KV-Cache vector. Each of the 64 numbers sits on one of the 8 allowed values.'});
  gapChart('with',{...WITH,M:8,ticks:TK8,label:`The KV-Cache vector rounded with Rotate. The red lines are short. Average error: ${f2(T.gap[0])}.`});
  gapChart('without',{vals:T.before,rounded:T.noRot.rounded,grid:T.noRot.vals,M:8,ticks:TK8,label:`The KV-Cache vector rounded without Rotate. The red lines are long. Average error: ${f2(T.gapNoRot[0])}.`});

  /* step 1 */
  function rotate(){
    if(S.rot) return; S.rot=true;
    const t=step(1);
    $('[data-empty]',t).hidden=true; $('[data-plot="after"]',t).hidden=false; $('[data-after-key]',t).hidden=false;
    $('[data-do="rot"]',t).disabled=true;
    plots.after.set({vals:T.before,out:T.OUT,label:'The KV-Cache vector before Rotate.'},true);
    api.later(()=>plots.after.set({vals:T.after,ring:true,label:'The KV-Cache vector after Rotate. Each dot holds a small part of the 4 outliers.'},api.rm()),80);
    award();
    api.later(()=>{ const said=show(1); open(2); api.say(said); },2000);
  }

  /* step 2 */
  const syncSel=()=>$('.vals',root).classList.toggle('sel-on',!!$('[data-num][aria-pressed="true"]',root));
  function renderRack(){
    const left=NUMS.filter(n=>S.placed[n.i]===undefined);
    $('[data-rack]',root).innerHTML=left.length
      ?left.map(n=>`<button type="button" class="term" data-num="${n.i}" aria-pressed="false" data-test="ch3-num-${n.i}">${n.txt}</button>`).join('')
      :'<p class="rack-done">All three numbers are rounded.</p>';
    syncSel();
  }
  function card(kind,N,done){
    let cls='', top='Drag a number from the <span class="c-green">green tray</span>.', body='';
    if(kind==='start') body='<p data-test="ch3-start">The <span class="c-green">green tray</span> holds the 3 numbers that you round. Drop each one on its closest allowed value.</p>';
    else if(kind==='sel') top=`Now tap the closest value for ${N.txt}.`;
    else if(kind==='nosel') top='Tap a number in the <span class="c-green">green tray</span> first.';
    else if(kind==='down') top='Put back. Pick any number.';
    else if(kind==='wrong'){
      const n=S.missed[N.i], h1='Round picks the allowed value that is closest to the number.', h2=`${N.txt} is between ${N.lo} and ${N.hi}. Look for the value that is closer.`;
      cls='bad'; top='Not this one.';
      body=`<div data-test="ch3-hint">${n===1?`<p>${h1}</p>`:n===2?`<p>${h2}</p>`:`<p>${h1}</p><p>${h2}</p><p><b>Try again.</b></p>`}</div>`;
    }
    else if(kind==='right'){
      cls='good'; top=`Right: ${N.txt} becomes ${N.to}.`;
      body=`<p data-why data-test="ch3-why">The number moved by ${N.gap}.</p>${done?`<p><b>All three numbers are rounded.</b> Now press Round the rest.</p><div class="row"><button type="button" class="btn t go${api.rm()?'':' pulse'}" data-do="rest" data-test="ch3-rest-card">Round the rest</button></div>`:''}`;
    }
    else if(kind==='rest'){
      cls='good'; top='All 64 numbers are rounded.';
      body=STARLINE;
    }
    hintCard($('[data-rule]',root),cls,top,body);
  }
  function tryRound(d){
    const N=NUMS.find(x=>x.i===d.n);
    if(!N||S.rest||S.placed[N.i]!==undefined) return;
    if(d.v!==N.k){
      S.missed[N.i]=(S.missed[N.i]||0)+1; renderRack();
      card('wrong',N); api.say('Not this one.');
      if(!api.replaying){ const b=$(`[data-num="${N.i}"]`,root); if(b) b.focus({preventScroll:true}); }
      return;
    }
    S.placed[N.i]=d.v;
    const tile=$(`[data-v="${d.v}"]`,root);
    $('.vslot',tile).innerHTML=`<span class="vnum" data-test="ch3-placed-${N.i}">${N.txt}</span>`;
    tile.setAttribute('aria-label',`${N.to}, with ${N.txt} on it`);
    renderRack();
    const done=Object.keys(S.placed).length===NUMS.length, rest=$('[data-do="rest"]',root);
    card('right',N,done); api.say(`Right: ${N.txt} becomes ${N.to}. The number moved by ${N.gap}.${done?' All three numbers are rounded. Now press Round the rest.':''}`);
    if(done){ rest.disabled=false; if(!api.rm()) rest.classList.add('pulse'); }
    if(!api.replaying){ const b=done?rest:$('[data-num]',root); if(b) b.focus({preventScroll:true}); }
  }
  function roundRest(){
    if(S.rest||Object.keys(S.placed).length<NUMS.length) return; S.rest=true;
    $$('[data-do="rest"]',root).forEach(x=>{ x.disabled=true; x.classList.remove('pulse'); });
    $$('.vtile',root).forEach(v=>{ v.disabled=true; });
    const counts=T.vals.map((_,k)=>T.idx.filter(x=>x===k).length);
    const others=[...T.after.keys()].filter(i=>!PICK.includes(i));
    const txt=i=>f2(r2(T.after[i]));
    const slotOf=k=>$('.vslot',$(`.vtile[data-v="${k}"]`,root));
    const put=(k,i)=>{ const s=slotOf(k); if(!s.firstChild) s.innerHTML=`<span class="vnum">${txt(i)}</span>`; };
    const showCounts=anim=>$$('.vtile',root).forEach((v,k)=>{
      let c=$('.vcount',v); if(!c){ c=document.createElement('span'); c.className='vcount'+(anim?' in':''); v.appendChild(c); }
      c.textContent=`${counts[k]} of 64`; });
    const chart=$('[data-plot="round"]',root), rack=$('[data-rack]',root), lab=$('[data-test="ch3-rack-lab"]',root);
    const finish=()=>{
      rack.innerHTML='<p class="rack-done">All 64 numbers are rounded.</p>'; lab.textContent='The Numbers to Round';
      plots.round.set({...ROUND,idx:T.idx,label:'The rounded KV-Cache vector. Each of the 64 numbers sits on one of the 8 allowed values.'},api.rm());
      $('[data-rest-key]',root).hidden=false;
      card('rest'); award();
      api.later(()=>{ const said=show(2); open(3); api.say(`All 64 numbers are rounded. ${said}`); },2000);
    };
    const ex=T.vals.map((_,k)=>others.find(i=>T.idx[i]===k));
    if(api.rm()){ ex.forEach((i,k)=>{ if(i!==undefined) put(k,i); }); showCounts(); finish(); return; }
    const wait=ms=>new Promise(r=>setTimeout(r,ms));
    const fly=(text,a,k,dur)=>{
      const s=slotOf(k).getBoundingClientRect(), g=document.createElement('span');
      g.className='term ex flying'; g.textContent=text;
      g.style.cssText=`position:fixed;left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;min-height:0;margin:0;z-index:25;pointer-events:none;`;
      document.body.appendChild(g);
      const dx=s.left+s.width/2-(a.left+a.width/2), dy=s.top+s.height/2-(a.top+a.height/2), sc=Math.min(1,(s.width-6)/a.width);
      return g.animate([{transform:'none'},{transform:`translate(${dx}px,${dy}px) scale(${sc})`}],{duration:dur,easing:'cubic-bezier(.45,.05,.3,1)',fill:'forwards'}).finished.then(()=>g.remove());
    };
    (async()=>{
      await glideTo([$('.vals',root).previousElementSibling,$('.vals',root),rack]);
      const todo=ex.map((i,k)=>({i,k})).filter(o=>o.i!==undefined&&!slotOf(o.k).firstChild);
      lab.textContent=`${todo.length} of the Other 61 Numbers`; rack.classList.add('exrow');
      rack.innerHTML=todo.map(o=>`<span class="term ex reveal-in" data-ex="${o.k}">${txt(o.i)}</span>`).join('');
      await wait(900);
      for(const o of todo){
        const el=$(`[data-ex="${o.k}"]`,rack), a=el.getBoundingClientRect(); el.style.visibility='hidden';
        fly(txt(o.i),a,o.k,950).then(()=>put(o.k,o.i)); await wait(600);
      }
      await wait(1000);
      showCounts(true); await wait(900);
      if(!root.isConnected) return;
      const mode=scrollMode();
      if(mode==='1') await glideTo([chart]);
      finish();
      if(mode==='2') pointTo([chart],'The chart changed');
    })();
  }

  /* step 3 */
  function compare(){
    if(S.cmp) return; S.cmp=true;
    const t=step(3);
    $$('[data-gap]',t).forEach(x=>x.removeAttribute('hidden'));
    $('[data-plot="gap"] svg',t).setAttribute('aria-label','The rounded KV-Cache vector with a red line from each number to its allowed value.');
    $('[data-gap-key]',t).hidden=false;
    $('[data-do="cmp"]',t).disabled=true;
    award(); const said=show(3); open(4);
    api.say(said);
  }
  function noRotate(){
    if(S.norot||!S.cmp) return; S.norot=true;
    const t=step(3), c=$('[data-norot]',t), say=$('[data-norot-say]',t);
    const [one,two]=matchMedia('(max-width:560px)').matches?['first','second']:['left','right'];
    say.innerHTML=`Without Rotate (the ${two} chart), the 8 allowed values must stretch to reach the 4 outliers. Then ${TOP2} of the 64 numbers land on only 2 values, and the <span class="c-red">red lines</span> are long. With Rotate (the ${one} chart), the allowed values sit close together, and every <span class="c-red">red line</span> is short. The average error is ${f2(T.gap[0])} with Rotate and ${f2(T.gapNoRot[0])} without Rotate: about ${Math.round(T.gapNoRot[0]/T.gap[0])} times larger.`;
    c.hidden=false; say.hidden=false; $('[data-do="norot"]',t).disabled=true;
    if(!api.replaying){ c.focus({preventScroll:true}); say.scrollIntoView({block:'nearest',behavior:smooth()}); }
    api.say(say.textContent);
  }

  /* step 4 */
  const NCP={vals:T.rounded,grid:T.vals,idx:T.idx,pick:PICK};
  function ncBeat(n){
    if(S.ncb!==n-1) return; S.ncb=n;
    const t=step(4), b=$(`[data-beat="${n}"]`,t);
    const len=i=>{ $('[data-len]',t).textContent=LEN[i]; }, part=sel=>{ const e=$(sel,t); e.hidden=false; void e.offsetWidth; e.style.width=((T.len[0]-T.len[1])/(HI-LO)*100).toFixed(1)+'%'; };
    b.hidden=false; $(`[data-do="nc${n}"]`,t).disabled=true;
    if(n===1){ len(1); $('[data-len-fill]',t).style.width=pct(T.len[1]); }
    else if(n===2){ $('[data-len-mark]',t).hidden=false; $('[data-mark-key]',t).hidden=false; part('[data-len-miss]'); }
    else{
      S.nc=true; len(0); part('[data-len-add]'); $('[data-ghost-key]',t).hidden=false;
      plots.nc.set({...NCP,at:T.vals.map(v=>v*F),ghost:true,label:`The KV-Cache vector after norm correction. Every number is ${SHORT}% farther from 0.`},api.rm());
      award();
      api.later(()=>{ const said=show(4); $('[data-fix]',t).hidden=false; open(5); api.say(`${b.textContent} ${said}`); },2000);
      return;
    }
    const nx=$(`[data-do="nc${n+1}"]`,t); nx.disabled=false;
    if(!api.replaying) nx.focus({preventScroll:true});
    api.say(b.textContent);
  }

  /* step 5 */
  function runTest(k){
    if(S.t[k]||(k&&S.t[k-1]<2)) return; S.t[k]=1;
    const t=step(5), o=TESTS[k], lane=$(`[data-lane="${k}"]`,t), grid=$('[data-grid]',lane), cells=$$('i',grid), miss=new Set(T.miss[k]), say=$('[data-say]',lane);
    let done=0, missed=0;
    $(`[data-do="t${k+1}"]`,t).disabled=true; into(lane);
    const paint=to=>{
      for(;done<to;done++){ const m=miss.has(done); if(m) missed++; cells[done].className=m?'miss':'hit'; }
      $('[data-found]',lane).textContent=`Found: ${done-missed} of ${NQ}`; $('[data-missed]',lane).textContent=`Misses: ${missed}`;
    };
    const end=()=>{
      paint(NQ); S.t[k]=2; say.textContent=o.words;
      const res=`${o.name}: found ${T.score[k]} of ${NQ}, misses ${MISS[k]}.`;
      grid.setAttribute('aria-label',res);
      if(k<2){
        const nx=$(`[data-do="t${k+2}"]`,t); nx.disabled=false;
        if(!api.replaying) nx.focus({preventScroll:true});
        into($(`[data-lane="${k+1}"]`,t)); api.say(res); return;
      }
      S.test=true; award(); const said=show(5); api.finish(); endCard();
      const w=$('[data-what="5"]',t), e=$('[data-end]',t);
      if(e.getBoundingClientRect().bottom-w.getBoundingClientRect().top<=innerHeight-28) into(e);
      else if(!api.replaying) w.scrollIntoView({block:'start',behavior:smooth()});
      api.say(`${res} ${said}`);
    };
    if(api.rm()) return end();
    const t0=performance.now(), DUR=4000;
    (function tick(){
      if(!root.isConnected) return;
      const n=Math.min(NQ,Math.floor((performance.now()-t0)/DUR*NQ));
      paint(n); say.textContent=`Lookup ${Math.min(n+1,NQ)} of ${NQ}`;
      if(n<NQ) requestAnimationFrame(tick); else end();
    })();
  }
  function endCard(){
    const e=$('[data-end]',root);
    e.innerHTML=`<div data-end-head>${endHead(api.G)}</div>
      <p>TurboQuant makes each KV-Cache vector (note) smaller. Rotate spreads the outliers across the full vector. Round then stores each number in 3 bits, not 16.</p><p>In this toy example, one vector went from ${64*16/8} bytes to ${64*3/8} bytes, and the model still found ${T.score[2]} of the ${NQ} lookups. Chapter 6 shows which TurboQuant setting to pick for your work.</p>
      <div class="row"><button type="button" class="btn t" data-again data-test="ch3-again">Play again</button><a class="btn next" href="#ch6/1" data-test="ch3-next-game">Next game: Ch 6 Setup for Daily Use</a></div>`;
    e.hidden=false;
  }

  root.addEventListener('click',e=>{
    if(justDragged) return;
    const el=e.target.closest('button'); if(!el||el.disabled||!root.contains(el)) return;
    if(['rot','rest','cmp','norot','nc1','nc2','nc3','t1','t2','t3'].includes(el.dataset.do)) api.do(el.dataset.do);
  });
  const drop=(el,z)=>{ if(z.dataset.v) api.do('try',{n:+el.dataset.num,v:+z.dataset.v}); };
  enableDrag(root,'[data-num]','[data-zone="val"], [data-zone="back"]',drop,true);
  enableTap(root,'[data-num]','[data-zone="val"]',drop,(kind,el)=>{ syncSel(); card(kind,el&&NUMS.find(n=>n.i===+el.dataset.num)); });

  plots.before.set({vals:T.before,out:T.OUT,label:'The KV-Cache vector before Rotate. The 4 red marks are the outliers.'},true);
  plots.round.set({...ROUND,label:'The KV-Cache vector after Rotate, with the 8 allowed values as dashed lines.'},true);
  plots.nc.set({...NCP,label:'The rounded KV-Cache vector. Each of the 64 numbers sits on one of the 8 allowed values.'},true);
  renderRack(); card('start');
  return {
    apply(type,d){
      if(type==='rot') rotate();
      else if(type==='try') tryRound(d);
      else if(type==='rest') roundRest();
      else if(type==='cmp') compare();
      else if(type==='norot') noRotate();
      else if(type==='nc'){ ncBeat(1); ncBeat(2); ncBeat(3); }
      else if(/^nc[123]$/.test(type)) ncBeat(+type[2]);
      else if(type==='test'){ runTest(0); runTest(1); runTest(2); }
      else if(/^t[123]$/.test(type)) runTest(type[1]-1);
    },
    ready(){ award(); }
  };
}

/* ================= Ch 6 · Setup for daily use ================= */

      what:`<p>The chat needs 30,000 tokens, and the KV-Cache holds ${nf(OFF.holds)} tokens with TurboQuant Off. The chat still fits.</p><p><b>In practice:</b> Chapter 5 of the tutorial tests a text of 25,000 tokens. A 16 GB graphics card holds that much without TurboQuant. TurboQuant helps when the work needs more than about 38,500 tokens.</p>`},

    {need:24000,right:'off',

  const KEY_MARK='<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false"><rect x="4.5" y="0.75" width="5" height="12.5" fill="#E9B44C" stroke="#1E1A16" stroke-width="1.5"></rect></svg>';

  const step=n=>$(`.step[data-step="${n}"]`,root);

        <div class="rack setrack"><div class="rack-tiles" role="group" aria-label="Settings">${SETS.map(o=>tile(o,n,sit)).join('')}</div><div class="rack-lip" aria-hidden="true"></div></div>

      </div>

    ${n===SITS.length?'<div class="endcard" data-end data-test="ch6-end" hidden></div>':''}
    ${navRow(G,n)}
  </section>`; }).join('')+``;

  const award=()=>api.stars(SITS.map((_,i)=>!!S.done[i+1]));
  const smooth=()=>api.rm()?'auto':'smooth';
  const into=el=>{ if(!api.replaying) el.scrollIntoView({block:el.getBoundingClientRect().height>innerHeight-28?'start':'nearest',behavior:smooth()}); };
  const syncSel=n=>$('.sit',step(n)).classList.toggle('sel-on',!!$('[data-set][aria-pressed="true"]',step(n)));
  function card(n,kind,o){
    const sit=SITS[n-1]; let cls='', top='Drag 1 setting into the box.', body='';
    if(kind==='start') body='<p data-test="ch6-start">Use the rule: pick the fastest setting that fits.</p>';
    else if(kind==='sel') top='Now tap the situation.';
    else if(kind==='nosel') top='Tap a setting first.';
    else if(kind==='down') top='Put back. Pick any setting.';
    else if(kind==='wrong'){
      const why=o.holds<sit.need
        ?`This setting does not fit. The situation needs ${nf(sit.need)} tokens, and ${o.html} holds ${nf(o.holds)} tokens.`
        :`This setting fits, but a faster setting also fits. With ${o.html}, the model writes ${o.tps} tokens per second.`;
      cls='bad'; top='Not this one.';
      body=`<div data-test="ch6-hint"><p>${why}</p>${S.miss[n]>1?'<p>Look for the fastest setting whose bar reaches the gold line.</p>':''}</div>`;
    }
    else if(kind==='right'){
      cls='good'; top=`Right: ${o.name}.`;
      body=`<p data-test="ch6-why">${sit.why}</p>${STARLINE}`;
    }
    hintCard($('[data-rule]',step(n)),cls,top,body);
  }
  function endCard(){
    const e=$('[data-end]',root);
    e.innerHTML=`<div data-end-head>${endHead(api.G)}</div>
      <p>Pick the fastest setting that fits. First, add the tokens of all the chats and agents that run at the same time. If the total is below about 38,500 tokens, leave TurboQuant off. If the total is more, use ${C4}. It holds ${nf(NC4.holds)} tokens on a 16 GB graphics card.</p>
      <h2>Why ${C3} Never Won</h2>
      <p>${C3} is the strongest setting. It holds about ${Math.round((K3.holds/NC4.holds-1)*100)}% more tokens than ${C4}. But the model writes more slowly with it, and its answers move farther from the model without TurboQuant. Use it only when the work fits in no other setting.</p>
      <div class="row"><button type="button" class="btn t" data-again data-test="ch6-again">Play again</button><a class="btn next" href="#finish" data-test="ch6-finish">Finish</a></div>`;
    e.hidden=false;
  }
  function tryPick(d){
    const n=d.s, sit=SITS[n-1], o=SETS.find(x=>x.k===d.k);
    if(!sit||!o||S.done[n]) return;
    const t=step(n), slot=$('[data-drop]',t);
    if(o.k!==sit.right){
      S.miss[n]=(S.miss[n]||0)+1; syncSel(n);
      card(n,'wrong',o); api.say('Not this one.');
      if(!api.rm()){ slot.classList.remove('shake'); void slot.offsetWidth; slot.classList.add('shake'); }
      if(!api.replaying) $(`[data-set="${o.k}"]`,t).focus({preventScroll:true});
      return;
    }
    S.done[n]=true;
    $$('[data-set]',t).forEach(b=>{ b.disabled=true; b.setAttribute('aria-pressed','false'); b.classList.toggle('won',b===$(`[data-set="${o.k}"]`,t)); });
    syncSel(n);
    slot.innerHTML=`${ICON.check}<span data-test="ch6-placed-${n}">${o.html}</span>`; slot.classList.add('ok'); slot.disabled=true;
    slot.setAttribute('aria-label',`${o.name} is on the situation`);
    card(n,'right',o); award();
    api.later(()=>{
      const w=$(`[data-what="${n}"]`,t); w.hidden=false;
      const said=$$('p',w).map(p=>p.textContent).join(' ');
      if(n<SITS.length){ const b=$(`[data-next="${n+1}"]`,root); b.disabled=false; if(!api.replaying) b.focus(); }
      else{
        api.finish(); endCard();
        const e=$('[data-end]',t);
        if(e.getBoundingClientRect().bottom-w.getBoundingClientRect().top<=innerHeight-28) into(e);
        else if(!api.replaying) w.scrollIntoView({block:'start',behavior:smooth()});
      }
      api.say(said);
    },2000);
  }

  const drop=el=>api.do('pick',{s:+el.closest('.step').dataset.step,k:el.dataset.set});
  enableDrag(root,'[data-set]','[data-zone="sit"]',drop,true);
  enableTap(root,'[data-set]','[data-zone="sit"]',drop,(kind,el)=>{
    const n=+$('.step:not([hidden])',root).dataset.step;
    if(S.done[n]) return;
    syncSel(n); card(n,kind);
  });
  SITS.forEach((_,i)=>card(i+1,'start'));
  return {
    apply(type,d){ if(type==='pick') tryPick(d); },
    ready(){ award(); }
  };
}

/* ===== gentle reveal ===== */
const DOC=document.documentElement;
const scrollMode=()=>(cur.g==='ch1'&&cur.step<=2)?'1':'2'; // 1 = fade in + slow glide (Ch 1 steps 1 and 2), 2 = stay put + pointer (every other step)
let glideRaf=0, glideDone=null, mountedAt=0;
function stopGlide(){ if(glideRaf){ cancelAnimationFrame(glideRaf); glideRaf=0; } if(glideDone){ const d=glideDone; glideDone=null; d(); } }
['wheel','touchstart','keydown','mousedown'].forEach(ev=>window.addEventListener(ev,stopGlide,{passive:true}));
function insets(){
  const tb=$('.topbar');
  let top=16;
  if(tb&&getComputedStyle(tb).display!=='none') top+=tb.getBoundingClientRect().height;
  const r=$('.step:not([hidden]) .rule'), fixed=r&&getComputedStyle(r).position==='fixed';
  return {top, bottom:16+(fixed?r.getBoundingClientRect().height:0)};
}
function boxOf(els){
  const rs=els.filter(Boolean).map(e=>e.getBoundingClientRect()).filter(r=>r.width||r.height);
  if(!rs.length) return null;
  return {top:Math.min(...rs.map(r=>r.top)), bottom:Math.max(...rs.map(r=>r.bottom))};
}
function targetY(els){
  const b=boxOf(els); if(!b) return null;
  const {top,bottom}=insets(), vh=innerHeight, room=vh-top-bottom;
  if(b.top>=top&&b.bottom<=vh-bottom) return null;                       // already in view
  const dy=(b.bottom-b.top>room||b.top<top)?b.top-top:b.bottom-(vh-bottom); // only as far as needed
  const max=DOC.scrollHeight-vh;
  return Math.max(0,Math.min(max,scrollY+dy));
}
function glideTo(els){
  return new Promise(done=>{
    const to=targetY(els); if(to===null) return done();
    const from=scrollY, dist=Math.abs(to-from); if(dist<2) return done();
    if(prefersRM()){ window.scrollTo(0,to); return done(); }
    const dur=Math.max(780,Math.min(1800,dist*2.9)), t0=performance.now();
    const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    stopGlide(); glideDone=done;
    const tick=now=>{
      const t=Math.min(1,(now-t0)/dur); window.scrollTo(0,from+(to-from)*ease(t));
      if(t<1) glideRaf=requestAnimationFrame(tick); else { glideRaf=0; glideDone=null; done(); }
    };
    glideRaf=requestAnimationFrame(tick);
  });
}
let pill=null, pillObs=null, revealAt=0;
function dropPill(){ if(pill){ pill.remove(); pill=null; } if(pillObs){ pillObs.disconnect(); pillObs=null; } }
// enough of it shows: it reaches into the window between the top inset and 40 px above the bottom inset
function seen(els){ const b=boxOf(els), i=insets(); return !!b&&b.top<innerHeight-i.bottom-40&&b.bottom>i.top; }
// the Back / Next row of the step on screen, once the star of that step is earned
function navOf(){ const nx=gstate(cur.g).earned[cur.step-1]?$('.step:not([hidden]) .navrow [data-next]'):null; return nx?nx.closest('.navrow'):null; }
// a result card brings the Back / Next row with it when both fit in the window
function groupOf(els,nav){
  if(!nav) return els;
  const g=els.concat(nav), b=boxOf(g), i=insets();
  return (b&&b.bottom-b.top<=innerHeight-i.top-i.bottom)?g:els;
}
// pointer button: leads to a new card that is off screen. When the card shows but Next of a finished step does not, it leads to Next.
function pointTo(els,label,nav){
  dropPill();
  const toNext=seen(els), watch=toNext?(nav?[nav]:null):els;
  if(!watch||(toNext&&seen(watch))) return;
  const ins=insets(), b=boxOf(watch); if(!b) return;
  const up=b.top<ins.top;
  pill=document.createElement('button'); pill.type='button'; pill.className='pill'; pill.dataset.test='pill';
  pill.innerHTML=`<span>${toNext?'Next step':label}</span><span aria-hidden="true">${up?'&uarr;':'&darr;'}</span>`;
  if(up) pill.style.top=ins.top+'px'; else pill.style.bottom=ins.bottom+'px';
  pill.addEventListener('click',()=>{
    dropPill();
    const to=toNext?watch:groupOf(els,nav), f=$('[data-next]',to[to.length-1])||els[0];
    if(!f.matches('a,button,[tabindex]')) f.tabIndex=-1;
    f.focus();                                                        // the keyboard focus stays in the step
    glideTo(to).then(()=>{ if(!toNext&&nav&&!pill) pointTo(els,label,nav); });
  });
  document.body.appendChild(pill);
  pillObs=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) dropPill(); },{rootMargin:`-${Math.round(ins.top)}px 0px -${Math.round(ins.bottom+40)}px 0px`});
  watch.forEach(e=>pillObs.observe(e));
}
const labelOf=el=>el.matches('.what')?'What Happened':el.matches('.predict')?'Question':el.matches('.endcard')?($('.end-open',el)?'Your stars':'Game complete'):el.matches('.full')?'The table is full':el.matches('.verdict')?(el.closest('.predict')?'Your answer':'The result'):'See what changed';
function reveal(els,label,fade){
  els=els.filter(Boolean); if(!els.length||(cur.api&&cur.api.replaying)) return;
  revealAt=performance.now();
  if(fade!==false&&!prefersRM()) els.forEach(el=>{ el.classList.remove('reveal-in'); void el.offsetWidth; el.classList.add('reveal-in'); });
  setTimeout(()=>{
    const nav=navOf();
    if(scrollMode()==='1'&&!prefersRM()) glideTo(groupOf(els,nav)); else pointTo(els,label||labelOf(els[0]),nav);
  },prefersRM()?0:350);
}
new MutationObserver(ms=>{
  if(performance.now()-mountedAt<80) return;
  const els=[];
  for(const m of ms){ const el=m.target;
    if(el.hidden||!el.matches('.what,.full,.endcard,.predict,.verdict')||!el.closest('.step:not([hidden])')) continue;
    if(el.matches('.verdict:not(.what)')&&el.closest('.predict')&&!el.textContent.trim()) continue;
    if(!els.includes(el)) els.push(el);
  }
  if(els.length){ els.sort((a,b)=>a.getBoundingClientRect().top-b.getBoundingClientRect().top); reveal(els); }
}).observe($('#main'),{subtree:true,attributes:true,attributeFilter:['hidden']});
// the app's own scroll and focus calls: no instant jumps
Element.prototype.scrollIntoView=function(){
  if(this.matches('.what,.full,.endcard,.predict,.verdict')) return;       // handled by reveal()
  if(scrollMode()==='1'&&!prefersRM()) glideTo([this]); else pointTo([this],'See what changed');
};
const focus0=HTMLElement.prototype.focus;
HTMLElement.prototype.focus=function(o){
  const r=focus0.call(this,Object.assign({},o,{preventScroll:true}));
  // The game moves the focus to Next when a step is done. A glide step with no result card (Ch 1 step 1) then glides to the hint card and the Back / Next row.
  if(this.matches('[data-next]')&&scrollMode()==='1'&&!(cur.api&&cur.api.replaying)){ const btn=this; setTimeout(()=>{
    if(performance.now()-revealAt<700||!btn.isConnected||btn.closest('.step').hidden) return;
    const nav=btn.closest('.navrow'), card=$('.rule',btn.closest('.step')), free=card&&getComputedStyle(card).position!=='fixed';
    if(prefersRM()) pointTo(free?[card]:[nav],'Next step',free?nav:null); else glideTo(free?groupOf([card],nav):[nav]);
  },350); }
  return r;
};
window.addEventListener('hashchange',dropPill);

if(/^https?:$/.test(location.protocol)&&/\/play\//.test(location.pathname)) $('.backlink').hidden=false;   // the back link shows only on the site
renderSaved();
route(true);
})();
</script>
